{{- if .Values.ingress.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-server
  {{- with .Values.ingress.httpRoute.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  parentRefs:
{{ toYaml .Values.ingress.httpRoute.parentRefs | indent 4 }}
  hostnames:
{{ toYaml .Values.ingress.httpRoute.hostnames | indent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-server
          port: 8080
{{- end }}
