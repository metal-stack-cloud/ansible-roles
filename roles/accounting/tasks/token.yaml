---
- name: Create api token for accounting
  delegate_to: localhost
  environment:
    METAL_APIV2_URL: "{{ accounting_metal_apiserver_url }}"
    METAL_APIV2_TOKEN: "{{ accounting_deployment_admin_token }}"
  block:
    - name: Create accounting tenant
      metal_v2_admin_tenant:
        identifier: accounting
        name: accounting
        description: tenant used by the accounting
      register: _tenant

    - name: Create accounting api token
      metal_v2_admin_token:
        identifier: accounting
        user: "{{ _tenant.id }}"
        description: accounting token
        expires: "{{ accounting_console_token_expiration }}"
        permissions: "{{ accounting_console_token_permissions }}"
      register: _token
